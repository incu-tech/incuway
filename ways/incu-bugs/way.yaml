# The real Incu bug-fixing way (incu-way-bugs), described as ways/v1alpha1.
apiVersion: ways/v1alpha1
kind: Way
metadata:
  name: incu/bugs
  displayName: Incu Bug Fixing
  version: 1.2.0
  description: Incu's bug-fixing flow — document → analyze → reproduce → fix-plan gate → fix → scans → PR.
  discipline: development
  publisher: incu

spec:
  skills:
    - path: ../../skills/incu-way-bugs
      uses: [vcs-host, sast, sca, code-quality]

  knowledge:
    - id: base
      description: Incu baseline conventions.
      applicability: { mode: always }
      pack:
        name: incu/base-conventions
        versionConstraint: ^1.0.0

  requires:
    cli:
      - name: git
        check: git --version
        required: true
      - name: gh
        check: gh --version
        required: true
        capability: vcs-host

  # Slice 10: slots derive from skills[].uses; these entries ENRICH the derived slots
  # (display metadata + suggested impls). `capabilitySlots` is the deprecated alias of `needs`.
  needs:
    - id: vcs-host
      displayName: Version-control host
      description: Hosts the repo and PRs — where this way opens and gates pull requests.
      contract: ways.dev/vcs-host@1
      required: true
      providerSource: environment
      options: [github, gitlab, bitbucket]
    - id: sast
      displayName: Static application security testing
      description: Scans first-party code for vulnerabilities in the validation phase.
      contract: ways.dev/sast@1
      required: true
      providerSource: environment
      options: [snyk, semgrep]
    - id: sca
      displayName: Software composition analysis
      description: Scans dependencies for known vulnerabilities in the validation phase.
      contract: ways.dev/sca@1
      required: true
      providerSource: environment
      options: [snyk]
    - id: code-quality
      displayName: Code quality analysis
      description: Static quality scan (bugs, code smells) required by the validation checklist.
      contract: ways.dev/code-quality@1
      required: true
      providerSource: environment
      options: [sonarqube]

  defaults:
    bindings:
      vcs-host: github
      sast: snyk
      sca: snyk
      code-quality: sonarqube

  flow:
    phases:
      - { id: discovery, label: Discovery & intake }
      - { id: document, label: Document the bug }
      - { id: analysis, label: Root-cause analysis }
      - { id: reproduction, label: Reproduction test }
      - { id: fix-plan, label: Fix plan }
      - { id: implementation, label: Fix }
      - { id: validation, label: Validation & scans }
      - { id: review, label: PR }
    gates:
      - { id: fix-plan, label: Fix plan confirmation, afterPhase: fix-plan, approval: user, enforcement: blocking }
      - { id: pr, label: PR review, afterPhase: review, approval: user, enforcement: blocking }
    generates:
      - { name: BUG.md, pathTemplate: 'docs/bugs/{slug}/BUG.md', producedInPhase: document, statusField: Status, required: true }
      - { name: ANALYSIS.md, pathTemplate: 'docs/bugs/{slug}/ANALYSIS.md', producedInPhase: analysis, required: true }
      - { name: FIX_PLAN.md, pathTemplate: 'docs/bugs/{slug}/FIX_PLAN.md', producedInPhase: fix-plan, gate: fix-plan, statusField: Status, required: true }
    state: .ways/state.json
