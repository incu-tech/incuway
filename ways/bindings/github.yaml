apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: github
  version: 1.0.0
  description: Satisfy vcs-host with GitHub (gh CLI).
spec:
  contract: ways.dev/vcs-host@1
  impl: github
  coversOperations: [read-repo, open-pr, pin-ref]
  requires:
    cli:
      - name: gh
        check: gh auth status
        versionConstraint: '>=2.0.0'
        install: 'brew install gh  (https://cli.github.com)'
        required: true
    env:
      - name: GH_TOKEN
        required: false
        secret: true
