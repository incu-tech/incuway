apiVersion: ways/v1alpha1
kind: Binding
metadata:
  name: sonarqube
  version: 1.0.0
  description: Satisfy the code-quality slot with SonarQube (run-sonar.sh).
spec:
  contract: ways.dev/code-quality@1
  impl: sonarqube
  coversOperations: [analyze, list-issues]
  requires:
    cli:
      - name: sonar-scanner
        check: sonar-scanner --version
        install: 'https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/scanners/sonarscanner/'
        required: true
    env:
      - name: SONAR_TOKEN
        required: true
        secret: true
      - name: SONAR_HOST_URL
        required: false
