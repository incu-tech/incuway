# incu/incu-way — the installable WayFamily for the whole incuway suite (ways/v1alpha1).
#
# THIS file is what `ways add github:incu-tech/incuway` consumes: the CLI clones the repo,
# requires a `way.yaml` at the root, and installs — as ONE reviewable plan — the member ways
# (`spec.members`) plus the payload shared across them (skills, knowledge, slots, requires).
#
# A family has NO `flow` of its own: each member way carries its own phase model and gate model.
# That is the point of this artifact — incuway ships three genuinely different gated flows
# (feature: 8 phases/5 gates · bug: 9 phases/2 gates · security: 8 phases/5 gates), which the
# old root manifest could only fake by declaring the feature flow as if it were the family's.
#
# Bundled `path:`/`file:` values are relative to this repo root and must not escape it (no `..`).
# Because a member way is installed from ITS OWN directory, the flow-driving skills are declared
# here (family level) rather than inside each member — see ways/README.md ("Layout").
#
# Validate:  ways validate way.yaml
#            ways conformance way.yaml     # → conformant (also conforms every bundled member)
# Install:   ways add github:incu-tech/incuway          (or: ways add /path/to/incuway)
#            ways add github:incu-tech/incuway --members dev,bugs    # a subset of the flows
apiVersion: ways/v1alpha1
kind: WayFamily
metadata:
  name: incu/incu-way
  displayName: Incuway
  version: 2.0.0
  description: The incuway family — the gated feature, bug and security flows as member ways, plus the shared onboarding, docs, refinement and assessment skills, the state contract, and the baseline conventions, installed as one.
  discipline: development
  publisher: incu
  homepage: https://github.com/incu-tech/incuway
  keywords: [incu, workflow, gates, development, bugs, security]

spec:
  # ── Members ───────────────────────────────────────────────────────────────────────────────
  # The gated work-item flows: each keeps its own phases, gates, generated documents and its
  # own `.ways/state.json` life cycle (one state file per worktree/branch). Consumers can
  # install a subset (`--members dev,bugs`); the shared payload below installs regardless,
  # because every member depends on it.
  members:
    - { id: dev, path: ways/incu-dev }           # incu/dev      → skills/incu-way-development
    - { id: bugs, path: ways/incu-bugs }         # incu/bugs     → skills/incu-way-bugs
    - { id: security, path: ways/incu-security } # incu/security → skills/snyk-remediation

  # ── Shared skills ─────────────────────────────────────────────────────────────────────────
  # Placed once for the whole family. Two groups:
  #   1. The skills that DRIVE the member flows (development, bugs, snyk-remediation). They live
  #      here, not inside each member dir, so the repo keeps a single `skills/` tree; the member
  #      manifests describe the flow those skills execute.
  #   2. Genuine building blocks — flows without a work-item state file (init, docs, po and the
  #      three assessment flows: they produce a document under `docs/`) plus prepare-pr, the only
  #      skill allowed to run git add/commit/push or `gh pr create`.
  # `uses` declares the slot ids a skill consumes: it is the derivation source for the family's
  # effective slot set and the provenance `bind`/`doctor` show (`needed by: <skill>`).
  skills:
    # 1. Member-flow drivers
    - { id: development, path: skills/incu-way-development, uses: [vcs-host, sast, sca, code-quality] }
    - { id: bugs, path: skills/incu-way-bugs, uses: [vcs-host, sast, sca, code-quality] }
    - { id: snyk-remediation, path: skills/snyk-remediation, uses: [vcs-host, sast, sca] }
    # 2. Building blocks shared by every member
    - { id: init, path: skills/incu-way-init, uses: [vcs-host] }
    - { id: docs, path: skills/incu-way-docs, uses: [vcs-host] }
    - { id: po, path: skills/incu-way-po, uses: [vcs-host] }
    - { id: arch-assessment, path: skills/incu-way-arch-assessment, uses: [vcs-host] }
    - { id: security-validation, path: skills/incu-way-security-validation, uses: [vcs-host] }
    - { id: threat-model, path: skills/incu-way-threat-model, uses: [vcs-host] }
    # The only skill that runs git add/commit/push or `gh pr create` — every flow defers
    # persistence to it, so an install without it dead-ends at every checkpoint.
    - { id: prepare-pr, path: skills/incu-way-prepare-pr, uses: [vcs-host] }

  # ── Shared knowledge ──────────────────────────────────────────────────────────────────────
  # Rules placed into the target project on `ways add` (steering), once for the family.
  # Bundled as `file:` (works today: staged + placed with applicability frontmatter). The bare
  # `pack:` form needs the registry to resolve; promote these to `pack: { name, source,
  # versionConstraint }` once the packs are published externally.
  knowledge:
    # THE canonical state contract — how the three member flows read/write .ways/state.json.
    # Always-on so it is in context whenever any of them runs.
    - id: state-contract
      description: Canonical .ways/state.json contract (ways/v1alpha1) — envelope, enums, lifecycle, read/write points.
      applicability: { mode: always }
      file: ways/rulepacks/state-contract/rules/state-contract.md
    # Incu baseline conventions, shared across incu ways (from the incu-base rulepack).
    - id: security
      description: Security-by-default conventions.
      applicability: { mode: always }
      file: ways/rulepacks/incu-base/rules/security.md
    - id: branch-flow
      description: Uniform PR-only branch flow.
      applicability: { mode: always }
      file: ways/rulepacks/incu-base/rules/branch-flow.md

  requires:
    cli:
      - name: git
        check: git --version
        required: true
      - name: gh
        check: gh --version
        versionConstraint: '>=2.0.0'
        install: 'brew install gh  (https://cli.github.com)'
        required: true
        capability: vcs-host

  # ── Shared slots ──────────────────────────────────────────────────────────────────────────
  # The family's effective slot set is the UNION of these and every member's own slots — a slot
  # id repeating across the family and a member is expected (a shared slot), not a collision.
  # These entries also ENRICH the slots derived from `skills[].uses` (display metadata +
  # suggested impls). `capabilitySlots` is the deprecated alias of `needs`.
  needs:
    - id: vcs-host
      displayName: Version-control host
      description: Hosts the repo and PRs — where incu-way-prepare-pr opens and gates pull requests for every flow.
      contract: ways.dev/vcs-host@1
      required: true
      cardinality: single
      providerSource: environment
      options: [github, gitlab, bitbucket]
    - id: sast
      displayName: Static application security testing
      description: Scans first-party code for vulnerabilities in each flow's validation phase.
      contract: ways.dev/sast@1
      required: true
      providerSource: environment
      options: [snyk, semgrep]
    - id: sca
      displayName: Software composition analysis
      description: Scans dependencies for known vulnerabilities in each flow's validation phase.
      contract: ways.dev/sca@1
      required: true
      providerSource: environment
      options: [snyk]
    - id: code-quality
      displayName: Code quality analysis
      description: Static quality scan (bugs, code smells) required by the validation checklists.
      contract: ways.dev/code-quality@1
      required: true
      providerSource: environment
      options: [sonarqube]

  defaults:
    bindings:
      vcs-host: github
      sast: snyk
      sca: snyk
      code-quality: sonarqube

  # Bundled inside the init skill so it travels with `ways add` (ways does not place
  # `templates:` yet — Slice-6+; skills travel wholesale, so init can copy it at runtime).
  templates:
    - skills/incu-way-init/claude.template.md
